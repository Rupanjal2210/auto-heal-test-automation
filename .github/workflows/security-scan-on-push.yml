name: Security Scan on Push

on:
  push:
    branches:
      - '**'

jobs:
  oss-vulnerability-scan:
    name: OSS Vulnerability Scan (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'auto-heal-test-automation'
          path: '.'
          format: 'HTML,CSV,SARIF'
          out: '.github/output/dependency-check'
          args: >-
            --enableRetired
            --enableExperimental
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-${{ github.sha }}
          path: .github/output/dependency-check/
          retention-days: 30

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: .github/output/dependency-check/dependency-check-report.sarif

  security-audit:
    name: Security Audit (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-extended

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build project
        run: mvn -B compile --no-transfer-progress

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java'
